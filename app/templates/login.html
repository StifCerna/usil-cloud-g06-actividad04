<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Grupo 06 USIL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container text-center" style="max-width: 400px;">
        <h2 class="mb-4">Portal Cloud - G06</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST" action="/">
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Usuario (Email)</label>
                        <input type="text" name="username" class="form-control" placeholder="ejemplo@cloudg06.usil.pe" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
