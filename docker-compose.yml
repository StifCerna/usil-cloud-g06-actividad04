services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - red_interna_g06

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: stifcerna/usil-cloud-g06-app:1.0.0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_interna_g06

  db:
    image: postgres:17.2-alpine
    env_file:
      - .env
    volumes:
      - pgdata_g06:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red_interna_g06
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  red_interna_g06:
    driver: bridge

volumes:
  pgdata_g06:
